<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainLink — دردشة المشرف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5B4FCF;--accent:#FF6B6B;--success:#22C55E;--warning:#F59E0B;--text-dark:#1E1B2E;--text-mid:#6B7280;--border:#E5E7EB;--bg:#F9F7FF;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--font:'Cairo',sans-serif;--sidebar:220px}
body{font-family:var(--font);background:var(--bg);color:var(--text-dark);display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);background:#1E1B2E;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;right:0;height:100vh;z-index:100}
.sidebar-logo{display:flex;align-items:center;gap:8px;padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center}
.sidebar-logo-icon i{color:white;font-size:15px}
.sidebar-logo-text{font-size:15px;font-weight:800;color:white}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;margin:1px 8px;border-radius:var(--radius-sm);transition:all 0.15s;text-decoration:none}
.nav-item:hover{background:rgba(255,255,255,0.06)}
.nav-item.active i,.nav-item.active span{color:var(--warning)!important}
.nav-item i{font-size:16px;color:rgba(255,255,255,0.5);width:18px}
.nav-item span{font-size:12px;color:rgba(255,255,255,0.5)}
.nav-badge{background:var(--accent);color:white;font-size:9px;padding:1px 6px;border-radius:20px;margin-right:auto}
.nav-section{padding:8px 16px 4px;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.5px;text-transform:uppercase}
.sidebar-bottom{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,0.08)}
.main{margin-right:var(--sidebar);flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:white;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:12px;color:var(--text-mid)}
.chat-layout{display:grid;grid-template-columns:280px 1fr;flex:1;overflow:hidden}
.conv-list{border-left:1px solid var(--border);background:white;display:flex;flex-direction:column;overflow:hidden}
.conv-search{padding:12px;border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);outline:none;background:var(--bg)}
.search-input:focus{border-color:var(--warning)}
.conv-section{padding:8px 12px 4px;font-size:10px;color:var(--text-mid);letter-spacing:0.5px;text-transform:uppercase;font-weight:600}
.conv-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:all 0.15s;position:relative}
.conv-item:hover{background:var(--bg)}
.conv-item.active{background:#FEF3C7;border-right:3px solid var(--warning)}
.conv-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;position:relative}
.online-dot{position:absolute;bottom:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid white}
.conv-name{font-size:12px;font-weight:700;color:var(--text-dark);margin-bottom:2px}
.conv-preview{font-size:11px;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.conv-time{position:absolute;top:10px;left:12px;font-size:10px;color:var(--text-mid)}
.type-badge{font-size:9px;padding:2px 6px;border-radius:20px;margin-top:3px;display:inline-block}
.chat-area{display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.chat-header{background:white;padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;position:relative}
.chat-header-name{font-size:14px;font-weight:700;color:var(--text-dark)}
.chat-header-sub{font-size:11px;color:var(--text-mid);display:flex;align-items:center;gap:4px;margin-top:2px}
.chat-header-actions{margin-right:auto;display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn i{color:var(--text-mid);font-size:15px}
.icon-btn:hover{background:#FEF3C7;border-color:var(--warning)}
.icon-btn:hover i{color:var(--warning)}
.messages-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.msg-date{text-align:center;font-size:10px;color:var(--text-mid);background:white;padding:4px 12px;border-radius:20px;align-self:center;border:1px solid var(--border)}
.msg-wrap{display:flex;align-items:flex-end;gap:8px}
.msg-wrap.mine{flex-direction:row-reverse}
.msg-avatar-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;flex-shrink:0}
.msg-bubble{max-width:380px;padding:10px 14px;border-radius:var(--radius-lg);font-size:13px;line-height:1.6}
.msg-wrap.other .msg-bubble{background:white;color:var(--text-dark);border-bottom-right-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.msg-wrap.mine .msg-bubble{background:var(--warning);color:white;border-bottom-left-radius:4px}
.msg-time{font-size:10px;margin-top:4px;opacity:0.6}
.msg-wrap.other .msg-time{color:var(--text-mid)}
.msg-wrap.mine .msg-time{color:rgba(255,255,255,0.7);text-align:right}
.chat-input-area{background:white;padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.attach-btn{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.attach-btn i{color:var(--text-mid);font-size:17px}
.attach-btn:hover{background:#FEF3C7;border-color:var(--warning)}
.attach-btn:hover i{color:var(--warning)}
.msg-input{flex:1;border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:9px 14px;font-size:13px;font-family:var(--font);outline:none;resize:none;min-height:38px;max-height:100px;background:var(--bg)}
.msg-input:focus{border-color:var(--warning)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--warning);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s}
.send-btn i{color:white;font-size:17px}
.send-btn:hover{background:#D97706;transform:scale(1.05)}
.empty-chat{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text-mid)}
.empty-chat i{font-size:48px;margin-bottom:12px;color:var(--border)}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ti ti-briefcase"></i></div><span class="sidebar-logo-text">TrainLink</span></div>
  <div class="sidebar-bottom"><a href="../public/02-login.html" class="nav-item"><i class="ti ti-logout" style="color:rgba(255,107,107,0.7)"></i><span style="color:rgba(255,107,107,0.7)">تسجيل الخروج</span></a></div>
</nav>

<div class="main">
  <div class="topbar">
    <div><div class="topbar-title">الدردشة 💬</div><div class="topbar-sub">التواصل مع المتدربين والشركات</div></div>
  </div>
  <div class="chat-layout">
    <div class="conv-list">
      <div class="conv-search"><input class="search-input" placeholder="🔍 بحث في المحادثات..." oninput="filterConversations(this.value)"></div>
      <div id="convContainer"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header" id="chatHeader" style="display:none">
        <div class="chat-header-avatar" id="chatAvatar" style="background:var(--primary)"></div>
        <div>
          <div class="chat-header-name" id="chatName"></div>
          <div class="chat-header-sub" id="chatSub"></div>
        </div>
        <div class="chat-header-actions">
          <div class="icon-btn"><i class="ti ti-phone"></i></div>
          <div class="icon-btn"><i class="ti ti-dots-vertical"></i></div>
        </div>
      </div>
      <div class="messages-area" id="messagesArea">
        <div class="empty-chat"><i class="ti ti-messages"></i><p>اختر محادثة للبدء</p></div>
      </div>
      <div class="chat-input-area" id="chatInputArea" style="display:none">
        <div class="attach-btn"><i class="ti ti-paperclip"></i></div>
        <textarea class="msg-input" id="msgInput" placeholder="اكتب رسالتك..." rows="1" onkeydown="handleEnter(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
const API='/api/chat';
let channels=[];
let currentChannelId=null;
let currentMessages=[];
let myName='';
const colors=['#5B4FCF','#FF6B6B','#22C55E','#7C3AED','#F59E0B','#0EA5E9','#EC4899','#14B8A6'];

function getToken(){return localStorage.getItem('trainlink_token')}
function getUser(){const u=localStorage.getItem('trainlink_user');return u?JSON.parse(u):null}
function logout(){localStorage.removeItem('trainlink_token');localStorage.removeItem('trainlink_user');window.location.href='../public/02-login.html'}

function getInitials(name){if(!name)return'?';const p=name.split(' ');return p.length>1?(p[0][0]+p[1][0]):p[0].substring(0,2)}

function renderConversations(filter){
  const q=(filter||'').toLowerCase();
  const container=document.getElementById('convContainer');
  let list=channels;
  if(q)list=list.filter(c=>(c.name||c.channel_name||'').toLowerCase().includes(q));
  if(!list.length){container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-mid);font-size:13px">لا توجد محادثات</div>';return}
  container.innerHTML=list.map((c,i)=>{
    const name=c.name||c.channel_name||'محادثة '+(i+1);
    const ini=getInitials(name);
    const cColor=colors[i%colors.length];
    const preview=c.last_message||'ابدأ المحادثة...';
    const time=c.last_message_time||'';
    return `<div class="conv-item${currentChannelId===c.id?' active':''}" onclick="openChannel(${c.id},'${name.replace(/'/g,"\\'")}','${ini}','${cColor}')">
      <div class="conv-avatar" style="background:${cColor}">${ini}</div>
      <div style="flex:1;min-width:0"><div class="conv-name">${name}</div><div class="conv-preview">${preview}</div></div>
      ${time?'<div class="conv-time">'+time+'</div>':''}
    </div>`;
  }).join('');
}

function filterConversations(q){renderConversations(q)}

async function openChannel(id,name,ini,color){
  currentChannelId=id;
  document.getElementById('chatHeader').style.display='flex';
  document.getElementById('chatInputArea').style.display='flex';
  document.getElementById('chatAvatar').textContent=ini;
  document.getElementById('chatAvatar').style.background=color;
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatSub').textContent='متصل الآن';
  renderConversations(document.querySelector('.search-input')?.value);

  try{
    const res=await fetch(API+'/channels/'+id+'/messages/',{headers:{'Authorization':'Bearer '+getToken()}});
    if(res.ok)currentMessages=await res.json();
  }catch(e){}
  renderMessages();
}

function renderMessages(){
  const area=document.getElementById('messagesArea');
  if(!currentMessages.length){area.innerHTML='<div class="empty-chat"><i class="ti ti-message-circle"></i><p>لا توجد رسائل بعد</p></div>';return}
  const user=getUser();
  area.innerHTML=currentMessages.map(m=>{
    const isMine=m.sender_name===user?.full_name;
    const ini=getInitials(m.sender_name||'');
    const time=m.created_at?new Date(m.created_at).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="msg-wrap ${isMine?'mine':'other'}">
      ${!isMine?'<div class="msg-avatar-sm" style="background:var(--primary)">'+ini+'</div>':''}
      <div><div class="msg-bubble">${m.content||''}</div><div class="msg-time">${time}</div></div>
    </div>`;
  }).join('');
  area.scrollTop=area.scrollHeight;
}

async function sendMessage(){
  if(!currentChannelId)return;
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  try{
    await fetch(API+'/channels/'+currentChannelId+'/messages/',{
      method:'POST',
      headers:{'Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},
      body:JSON.stringify({content:text})
    });
    const res=await fetch(API+'/channels/'+currentChannelId+'/messages/',{headers:{'Authorization':'Bearer '+getToken()}});
    if(res.ok)currentMessages=await res.json();
    renderMessages();
  }catch(e){}
}

function handleEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

document.addEventListener('DOMContentLoaded',async()=>{
  if(!getToken()){window.location.href='../public/02-login.html';return}
  const user=getUser();
  myName=user?.full_name||'';
  try{
    const res=await fetch(API+'/channels/',{headers:{'Authorization':'Bearer '+getToken()}});
    if(res.ok)channels=await res.json();
  }catch(e){}
  renderConversations();
});
</script>
</body>
</html>
