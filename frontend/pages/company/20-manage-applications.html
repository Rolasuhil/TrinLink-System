<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainLink — إدارة الطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5B4FCF;--primary-light:#EEF0FF;--accent:#FF6B6B;--success:#22C55E;--success-light:#F0FFF4;--warning:#F59E0B;--warning-light:#FEF3C7;--text-dark:#1E1B2E;--text-mid:#6B7280;--border:#E5E7EB;--dark:#0F0E1A;--dark-2:#1A1827;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--font:'Cairo',sans-serif}
body{font-family:var(--font);background:var(--dark);color:white;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1A1827;border-bottom:1px solid rgba(255,255,255,0.08);height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
.top-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.top-logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center}
.top-logo-icon i{color:white;font-size:15px}
.top-logo-text{font-size:15px;font-weight:800;color:white}
.top-nav{display:flex;gap:2px;margin-right:auto}
.top-nav-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);cursor:pointer;border:none;background:transparent;font-family:var(--font);transition:all 0.15s;display:flex;align-items:center;gap:6px;text-decoration:none}
.top-nav-item:hover{background:rgba(255,255,255,0.06);color:white}
.top-nav-item.active{background:var(--primary);color:white}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);padding:6px 12px}
.chip-avatar{width:26px;height:26px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white}
.chip-name{font-size:12px;font-weight:600;color:white}
.content{padding:20px 24px;flex:1}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:20px;font-weight:800;color:white}
.page-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-top:3px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mini-stat{background:#1A1827;border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:14px;display:flex;align-items:center;gap:10px}
.mini-stat-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-stat-icon i{font-size:20px}
.mini-stat-num{font-size:22px;font-weight:800;color:white}
.mini-stat-label{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px}
.filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-select{padding:8px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);color:rgba(255,255,255,0.7);background:#1A1827;outline:none;cursor:pointer}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:16px}
.search-input{width:100%;padding:9px 38px 9px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);color:white;background:#1A1827;outline:none}
.search-input::placeholder{color:rgba(255,255,255,0.2)}
.tab-row{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:7px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-family:var(--font);transition:all 0.15s}
.tab.active{background:var(--primary);color:white}
.tab:hover:not(.active){background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
.app-card{background:#1A1827;border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-lg);padding:16px;margin-bottom:10px;transition:all 0.2s}
.app-card:hover{border-color:rgba(91,79,207,0.4)}
.app-card-inner{display:flex;align-items:flex-start;gap:14px}
.trainee-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0}
.trainee-name{font-size:14px;font-weight:700;color:white;margin-bottom:2px}
.trainee-meta{font-size:12px;color:rgba(255,255,255,0.4);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.trainee-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ttag{font-size:10px;padding:3px 8px;border-radius:20px}
.match-section{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.match-label{font-size:12px;color:rgba(255,255,255,0.4)}
.match-bar-track{flex:1;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.match-bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
.match-pct{font-size:12px;font-weight:700;width:36px;text-align:left}
.action-row{display:flex;gap:8px;align-items:center}
.btn-accept{padding:8px 20px;background:var(--success);color:white;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px;transition:all 0.15s}
.btn-accept:hover{background:#16a34a}
.btn-reject{padding:8px 16px;background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px;transition:all 0.15s}
.btn-reject:hover{background:rgba(255,107,107,0.1)}
.btn-view-cv{padding:8px 14px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px}
.btn-chat{padding:8px 14px;background:rgba(91,79,207,0.15);color:#A89CFF;border:1px solid rgba(91,79,207,0.3);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px}
.status-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;margin-right:auto}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1A1827;border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-lg);padding:28px;width:90%;max-width:420px}
.modal-title{font-size:18px;font-weight:800;color:white;margin-bottom:4px}
.modal-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:6px}
.form-textarea{width:100%;padding:10px;border:1.5px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);color:white;background:rgba(255,255,255,0.05);outline:none;resize:none;min-height:80px}
.modal-footer{display:flex;gap:10px;margin-top:14px}
.btn-cancel{flex:1;padding:10px;border-radius:var(--radius-md);font-size:13px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);cursor:pointer;font-family:var(--font)}
.btn-confirm-reject{flex:2;padding:10px;border-radius:var(--radius-md);font-size:13px;font-weight:700;color:white;background:var(--accent);border:none;cursor:pointer;font-family:var(--font)}
.empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3)}
.empty-state i{font-size:48px;margin-bottom:12px;display:block}
.empty-state p{font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D2B3E;color:white;padding:12px 20px;border-radius:var(--radius-lg);font-size:13px;display:none;align-items:center;gap:10px;z-index:9999;border:1px solid rgba(255,255,255,0.1)}
.toast.show{display:flex}
</style>
</head>
<body>
<div class="topbar">
  <a href="#" class="top-logo"><div class="top-logo-icon"><i class="ti ti-briefcase"></i></div><span class="top-logo-text">TrainLink</span></a>
  <div class="top-nav">
    <a href="18-company-dashboard.html" class="top-nav-item"><i class="ti ti-layout-dashboard"></i>لوحة التحكم</a>
    <a href="19-post-internship.html" class="top-nav-item"><i class="ti ti-plus-circle"></i>نشر فرصة</a>
    <a href="#" class="top-nav-item active"><i class="ti ti-clipboard-list"></i>الطلبات</a>
    <a href="21-trainees-progress.html" class="top-nav-item"><i class="ti ti-chart-line"></i>المتدربون</a>
    <a href="23-company-chat.html" class="top-nav-item"><i class="ti ti-messages"></i>الدردشة</a>
    <a href="22-company-profile.html" class="top-nav-item"><i class="ti ti-building"></i>ملف الشركة</a>
  </div>
  <div class="icon-btn" onclick="window.location.href='22-company-profile.html'" title="ملف الشركة"><i class="ti ti-building"></i></div>
</div>

<div class="content">
  <div class="page-header">
    <div><div class="page-title">إدارة الطلبات 📋</div><div class="page-sub">مراجعة وقبول أو رفض طلبات التدريب</div></div>
  </div>

  <div class="stats-row">
    <div class="mini-stat"><div class="mini-stat-icon" style="background:rgba(91,79,207,0.2)"><i class="ti ti-users" style="color:#A89CFF"></i></div><div><div class="mini-stat-num" id="statTotal">0</div><div class="mini-stat-label">إجمالي الطلبات</div></div></div>
    <div class="mini-stat"><div class="mini-stat-icon" style="background:rgba(245,158,11,0.15)"><i class="ti ti-clock" style="color:var(--warning)"></i></div><div><div class="mini-stat-num" id="statPending">0</div><div class="mini-stat-label">في الانتظار</div></div></div>
    <div class="mini-stat"><div class="mini-stat-icon" style="background:rgba(34,197,94,0.15)"><i class="ti ti-check" style="color:var(--success)"></i></div><div><div class="mini-stat-num" id="statAccepted">0</div><div class="mini-stat-label">مقبول</div></div></div>
    <div class="mini-stat"><div class="mini-stat-icon" style="background:rgba(255,107,107,0.15)"><i class="ti ti-x" style="color:var(--accent)"></i></div><div><div class="mini-stat-num" id="statRejected">0</div><div class="mini-stat-label">مرفوض</div></div></div>
  </div>

  <div class="filters-row">
    <div class="search-wrap"><i class="ti ti-search search-icon"></i><input class="search-input" placeholder="بحث باسم المتدرب..." oninput="searchApps(this.value)"></div>
    <select class="filter-select" id="filterInternship" onchange="loadApplications()"><option value="">كل الفرص</option></select>
  </div>

  <div class="tab-row">
    <button class="tab active" onclick="filterApps(this,'all')">الكل</button>
    <button class="tab" onclick="filterApps(this,'pending')">⏳ انتظار</button>
    <button class="tab" onclick="filterApps(this,'accepted')">✓ مقبول</button>
    <button class="tab" onclick="filterApps(this,'rejected')">✗ مرفوض</button>
  </div>

  <div id="appsList">
    <div class="empty-state" id="emptyState"><i class="ti ti-clipboard-off"></i><p>لا توجد طلبات بعد</p></div>
  </div>
</div>

<div class="modal-overlay" id="rejectModal">
  <div class="modal">
    <div class="modal-title">رفض الطلب</div>
    <div class="modal-sub">يرجى ذكر سبب الرفض لإشعار المتدرب</div>
    <label class="form-label">سبب الرفض <span style="color:var(--accent)">*</span></label>
    <textarea class="form-textarea" id="rejectReason" placeholder="مثال: نحتاج خبرة أكثر في React."></textarea>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="document.getElementById('rejectModal').classList.remove('open')">إلغاء</button>
      <button class="btn-confirm-reject" onclick="confirmReject()"><i class="ti ti-x"></i>تأكيد الرفض</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-circle-check" style="color:var(--success);font-size:18px"></i><span id="toastMsg"></span></div>

<script>
const API='http://127.0.0.1:8000';
let authToken=localStorage.getItem('trainlink_token');
let allApplications=[];
let currentRejectAppId=null;

(function init(){
  if(!authToken){window.location.href='../public/02-login.html';return;}
  loadProfile();loadApplications();
})();

async function loadProfile(){
  try{
    const res=await fetch(`${API}/api/auth/profile/`,{headers:{'Authorization':`Bearer ${authToken}`}});
    if(!res.ok){window.location.href='../public/02-login.html';return;}
    const data=await res.json();
    const name=data.company_name||data.full_name||'الشركة';
  }catch(e){}
}

async function loadApplications(){
  try{
    const res=await fetch(`${API}/api/internships/applications/`,{headers:{'Authorization':`Bearer ${authToken}`}});
    if(!res.ok)return;
    allApplications=await res.json();
    if(!Array.isArray(allApplications))allApplications=[];
    updateStats();renderApplications(allApplications);
  }catch(e){}
}

function updateStats(){
  const total=allApplications.length;
  const pending=allApplications.filter(a=>a.status==='pending').length;
  const accepted=allApplications.filter(a=>a.status==='accepted').length;
  const rejected=allApplications.filter(a=>a.status==='rejected').length;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statPending').textContent=pending;
  document.getElementById('statAccepted').textContent=accepted;
  document.getElementById('statRejected').textContent=rejected;
}

function renderApplications(apps){
  const container=document.getElementById('appsList');
  const empty=document.getElementById('emptyState');
  if(apps.length===0){container.innerHTML='';container.appendChild(empty);empty.style.display='block';return;}
  empty.style.display='none';
  container.innerHTML=apps.map(app=>{
    const name=app.trainee?.full_name||'متدرب';
    const initials=name.substring(0,2);
    const colors=['#5B4FCF','#22C55E','#FF6B6B','#F59E0B','#3B82F6'];
    const color=colors[app.id%colors.length];
    const statusMap={pending:{label:'⏳ جديد',bg:'rgba(245,158,11,0.15)',color:'var(--warning)'},accepted:{label:'✓ مقبول',bg:'rgba(34,197,94,0.15)',color:'var(--success)'},rejected:{label:'✗ مرفوض',bg:'rgba(255,107,107,0.15)',color:'var(--accent)'}};
    const st=statusMap[app.status]||statusMap.pending;
    const actions=app.status==='pending'?`
      <button class="btn-accept" onclick="acceptApp(${app.id})"><i class="ti ti-check"></i>قبول</button>
      <button class="btn-reject" onclick="openRejectModal(${app.id})"><i class="ti ti-x"></i>رفض</button>`:
      app.status==='accepted'?`<button class="btn-chat" onclick="window.location.href='23-company-chat.html'"><i class="ti ti-messages"></i>مراسلة</button>`:'';
    return`<div class="app-card" data-status="${app.status}" data-id="${app.id}">
      <div class="app-card-inner">
        <div class="trainee-avatar" style="background:${color}">${initials}</div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div><div class="trainee-name">${name}</div>
            <div class="trainee-meta">${app.internship?.title?'<span>📂 '+app.internship.title+'</span>':''}</div></div>
            <span class="status-badge" style="background:${st.bg};color:${st.color}">${st.label}</span>
          </div>
          <div class="action-row">${actions}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterApps(btn,status){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const filtered=status==='all'?allApplications:allApplications.filter(a=>a.status===status);
  renderApplications(filtered);
}

function searchApps(q){
  const filtered=allApplications.filter(a=>a.trainee?.full_name?.toLowerCase().includes(q.toLowerCase()));
  renderApplications(filtered);
}

async function acceptApp(id){
  try{
    const res=await fetch(`${API}/api/internships/applications/${id}/`,{
      method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},
      body:JSON.stringify({status:'accepted'})
    });
    if(res.ok){showToast('✅ تم قبول المتدرب!');loadApplications();}
    else{showToast('❌ فشل القبول');}
  }catch(e){showToast('❌ خطأ');}
}

function openRejectModal(id){currentRejectAppId=id;document.getElementById('rejectModal').classList.add('open');}

async function confirmReject(){
  const reason=document.getElementById('rejectReason').value.trim();
  if(!reason){showToast('⚠️ يرجى ذكر سبب الرفض');return;}
  try{
    const res=await fetch(`${API}/api/internships/applications/${currentRejectAppId}/`,{
      method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},
      body:JSON.stringify({status:'rejected',rejection_reason:reason})
    });
    document.getElementById('rejectModal').classList.remove('open');
    document.getElementById('rejectReason').value='';
    if(res.ok){showToast('تم رفض الطلب');loadApplications();}
  }catch(e){showToast('❌ خطأ');}
}

function showToast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
</script>
</body>
</html>
