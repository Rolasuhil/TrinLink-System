<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainLink — دردشة الشركة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5B4FCF;--accent:#FF6B6B;--success:#22C55E;--warning:#F59E0B;--dark:#0F0E1A;--dark-2:#1A1827;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--font:'Cairo',sans-serif}
body{font-family:var(--font);background:var(--dark);color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#1A1827;border-bottom:1px solid rgba(255,255,255,0.08);height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.top-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.top-logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center}
.top-logo-icon i{color:white;font-size:15px}
.top-logo-text{font-size:15px;font-weight:800;color:white}
.top-nav{display:flex;gap:2px;margin-right:auto}
.top-nav-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);cursor:pointer;border:none;background:transparent;font-family:var(--font);transition:all 0.15s;display:flex;align-items:center;gap:6px;text-decoration:none}
.top-nav-item:hover{background:rgba(255,255,255,0.06);color:white}
.top-nav-item.active{background:var(--primary);color:white}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn i{color:rgba(255,255,255,0.4);font-size:15px}
.icon-btn:hover{background:rgba(91,79,207,0.2);border-color:rgba(91,79,207,0.4)}
.icon-btn:hover i{color:#A89CFF}
.chat-layout{display:grid;grid-template-columns:280px 1fr;flex:1;overflow:hidden}
.conv-list{background:#1A1827;border-left:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column}
.conv-search{padding:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.search-input{width:100%;padding:8px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);color:white;background:rgba(255,255,255,0.05);outline:none}
.search-input::placeholder{color:rgba(255,255,255,0.2)}
.conv-section{padding:8px 12px 4px;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.5px;text-transform:uppercase}
.conv-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);transition:all 0.15s;position:relative}
.conv-item:hover{background:rgba(255,255,255,0.03)}
.conv-item.active{background:rgba(91,79,207,0.15);border-right:3px solid var(--primary)}
.conv-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;position:relative}
.online-dot{position:absolute;bottom:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid #1A1827}
.conv-name{font-size:12px;font-weight:700;color:white;margin-bottom:2px}
.conv-preview{font-size:11px;color:rgba(255,255,255,0.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.conv-time{position:absolute;top:10px;left:12px;font-size:10px;color:rgba(255,255,255,0.2)}
.conv-unread{position:absolute;bottom:10px;left:12px;min-width:16px;height:16px;background:var(--primary);color:white;border-radius:20px;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.type-badge{font-size:9px;padding:2px 6px;border-radius:20px;margin-top:3px;display:inline-block}
.chat-area{display:flex;flex-direction:column;background:rgba(255,255,255,0.01);overflow:hidden}
.chat-header{background:#1A1827;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;position:relative}
.chat-header-name{font-size:14px;font-weight:700;color:white}
.chat-header-sub{font-size:11px;color:rgba(255,255,255,0.3);display:flex;align-items:center;gap:5px;margin-top:2px}
.chat-header-actions{margin-right:auto;display:flex;gap:6px}
.messages-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.msg-date{text-align:center;font-size:10px;color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.04);padding:4px 12px;border-radius:20px;align-self:center;border:1px solid rgba(255,255,255,0.06)}
.msg-wrap{display:flex;align-items:flex-end;gap:8px}
.msg-wrap.mine{flex-direction:row-reverse}
.msg-avatar-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;flex-shrink:0}
.msg-bubble{max-width:380px;padding:10px 14px;border-radius:var(--radius-lg);font-size:13px;line-height:1.6}
.msg-wrap.other .msg-bubble{background:#1A1827;color:white;border-bottom-right-radius:4px;border:1px solid rgba(255,255,255,0.06)}
.msg-wrap.mine .msg-bubble{background:var(--primary);color:white;border-bottom-left-radius:4px}
.msg-time{font-size:10px;margin-top:4px;opacity:0.5}
.msg-wrap.other .msg-time{color:rgba(255,255,255,0.3)}
.msg-wrap.mine .msg-time{color:rgba(255,255,255,0.5);text-align:right}
.chat-input-area{background:#1A1827;padding:12px 20px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.attach-btn{width:34px;height:34px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.attach-btn i{color:rgba(255,255,255,0.4);font-size:17px}
.attach-btn:hover{background:rgba(91,79,207,0.2)}
.attach-btn:hover i{color:#A89CFF}
.msg-input{flex:1;border:1.5px solid rgba(255,255,255,0.1);border-radius:var(--radius-lg);padding:9px 14px;font-size:13px;font-family:var(--font);outline:none;resize:none;min-height:38px;max-height:100px;line-height:1.5;background:rgba(255,255,255,0.05);color:white}
.msg-input::placeholder{color:rgba(255,255,255,0.2)}
.msg-input:focus{border-color:var(--primary)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--primary);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s}
.send-btn i{color:white;font-size:17px}
.send-btn:hover{background:#4A3FB5;transform:scale(1.05)}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:rgba(255,255,255,0.3)}
.empty-chat i{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div class="topbar">
  <a href="#" class="top-logo"><div class="top-logo-icon"><i class="ti ti-briefcase"></i></div><span class="top-logo-text">TrainLink</span></a>
  <div class="top-nav">
    <a href="18-company-dashboard.html" class="top-nav-item"><i class="ti ti-layout-dashboard"></i>لوحة التحكم</a>
    <a href="19-post-internship.html" class="top-nav-item"><i class="ti ti-plus-circle"></i>نشر فرصة</a>
    <a href="20-manage-applications.html" class="top-nav-item"><i class="ti ti-clipboard-list"></i>الطلبات</a>
    <a href="21-trainees-progress.html" class="top-nav-item"><i class="ti ti-chart-line"></i>المتدربون</a>
    <a href="#" class="top-nav-item active"><i class="ti ti-messages"></i>الدردشة</a>
    <a href="22-company-profile.html" class="top-nav-item"><i class="ti ti-building"></i>ملف الشركة</a>
  </div>
  <div class="icon-btn" onclick="window.location.href='22-company-profile.html'" title="ملف الشركة"><i class="ti ti-building"></i></div>
</div>

<div class="chat-layout">
  <div class="conv-list">
    <div class="conv-search"><input class="search-input" placeholder="🔍 بحث..." oninput="filterConvs(this.value)"></div>
    <div id="convContainer"></div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader" style="display:none">
      <div class="chat-header-avatar" id="chatAvatar" style="background:#5B4FCF">--<div class="online-dot"></div></div>
      <div>
        <div class="chat-header-name" id="chatName">--</div>
        <div class="chat-header-sub" id="chatSub">--</div>
      </div>
      <div class="chat-header-actions">
        <div class="icon-btn"><i class="ti ti-user"></i></div>
        <div class="icon-btn"><i class="ti ti-phone"></i></div>
      </div>
    </div>

    <div class="messages-area" id="messagesArea">
      <div class="empty-chat" id="emptyChat"><i class="ti ti-messages"></i><p>اختر محادثة لبدء الدردشة</p></div>
    </div>

    <div class="chat-input-area" id="chatInputArea" style="display:none">
      <div class="attach-btn"><i class="ti ti-paperclip"></i></div>
      <div class="attach-btn"><i class="ti ti-photo"></i></div>
      <textarea class="msg-input" id="msgInput" placeholder="اكتب رسالتك..." rows="1" onkeydown="handleEnter(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()"><i class="ti ti-send"></i></button>
    </div>
  </div>
</div>

<script>
const API='http://127.0.0.1:8000';
let token=localStorage.getItem('trainlink_token');
let channels=[];
let currentChannelId=null;
const colors=['#5B4FCF','#22C55E','#FF6B6B','#F59E0B','#3B82F6','#EC4899'];

(function init(){
  if(!token){window.location.href='../public/02-login.html';return;}
  loadChannels();
})();

function authHeaders(){return{'Content-Type':'application/json','Authorization':'Bearer '+token};}

async function loadChannels(){
  try{
    const res=await fetch(`${API}/api/chat/channels/`,{headers:authHeaders()});
    if(!res.ok)return;
    const data=await res.json();
    channels=Array.isArray(data)?data:(data.results||[]);
    renderConversations(channels);
  }catch(e){}
}

function renderConversations(list){
  const container=document.getElementById('convContainer');
  if(list.length===0){container.innerHTML='<div style="padding:30px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px">لا توجد محادثات</div>';return;}
  container.innerHTML='';
  list.forEach((ch,i)=>{
    const name=ch.name||ch.title||'محادثة';
    const initials=name.substring(0,2);
    const color=colors[i%colors.length];
    const lastMsg=ch.last_message?.content||ch.last_message?.text||'';
    const unread=ch.unread_count||0;
    const isOnline=ch.is_online||false;
    const item=document.createElement('div');
    item.className='conv-item'+(currentChannelId===ch.id?' active':'');
    item.onclick=function(){openChat(ch.id,name,initials,color,lastMsg);};
    item.innerHTML=`<div class="conv-avatar" style="background:${color}">${initials}${isOnline?'<div class="online-dot"></div>':''}</div>
      <div style="flex:1;min-width:0"><div class="conv-name">${name}</div><div class="conv-preview">${lastMsg}</div></div>
      ${unread?`<div class="conv-unread">${unread}</div>`:''}`;
    container.appendChild(item);
  });
}

function openChat(id,name,initials,color,lastMsg){
  currentChannelId=id;
  document.querySelectorAll('.conv-item').forEach(i=>i.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('chatHeader').style.display='flex';
  document.getElementById('chatInputArea').style.display='flex';
  document.getElementById('emptyChat').style.display='none';
  document.getElementById('chatAvatar').textContent=initials;
  document.getElementById('chatAvatar').style.background=color;
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatSub').innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block"></span>متصل الآن';
  loadMessages(id);
}

async function loadMessages(channelId){
  const area=document.getElementById('messagesArea');
  area.innerHTML='<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:12px">جاري التحميل...</div>';
  try{
    const res=await fetch(`${API}/api/chat/channels/${channelId}/messages/`,{headers:authHeaders()});
    if(!res.ok){area.innerHTML='<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:12px">لا توجد رسائل</div>';return;}
    const data=await res.json();
    const msgs=Array.isArray(data)?data:(data.results||[]);
    if(msgs.length===0){area.innerHTML='<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:12px">ابدأ المحادثة 👋</div>';return;}
    area.innerHTML='<div class="msg-date">الرسائل</div>';
    msgs.forEach(m=>{
      const isMine=m.sender_type==='company'||m.is_mine;
      const time=m.created_at?new Date(m.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
      const wrap=document.createElement('div');
      wrap.className='msg-wrap '+(isMine?'mine':'other');
      wrap.innerHTML=`<div class="msg-avatar-sm" style="background:${isMine?'var(--primary)':color}">${isMine?'CO':(m.sender_name||'').substring(0,2)||'?'}</div>
        <div><div class="msg-bubble">${m.content||m.text||''}</div><div class="msg-time">${time}</div></div>`;
      area.appendChild(wrap);
    });
    area.scrollTop=area.scrollHeight;
  }catch(e){area.innerHTML='<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:12px">خطأ في التحميل</div>';}
}

async function sendMessage(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text||!currentChannelId)return;
  const area=document.getElementById('messagesArea');
  const now=new Date();
  const time=now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  const wrap=document.createElement('div');
  wrap.className='msg-wrap mine';
  wrap.innerHTML=`<div class="msg-avatar-sm" style="background:var(--primary)">CO</div><div><div class="msg-bubble">${text}</div><div class="msg-time">${time}</div></div>`;
  area.appendChild(wrap);
  area.scrollTop=area.scrollHeight;
  input.value='';
  try{
    await fetch(`${API}/api/chat/channels/${currentChannelId}/messages/`,{
      method:'POST',headers:authHeaders(),
      body:JSON.stringify({content:text})
    });
  }catch(e){}
}

function handleEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

function filterConvs(q){
  const filtered=channels.filter(ch=>(ch.name||ch.title||'').includes(q));
  renderConversations(filtered);
}
</script>
</body>
</html>
