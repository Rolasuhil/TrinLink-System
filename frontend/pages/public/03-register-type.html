<!DOCTYPE html>
<!-- صفحة اختيار نوع الحساب في منصة TrainLink - المستخدم يختار بين: متدرب، مشرف أكاديمي، شركة -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainLink — اختيار نوع الحساب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
/* إعادة تعيين الأنماط الأساسية */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* المتغيرات اللونية والخطوط */
:root{--primary:#5B4FCF;--primary-dark:#4A3FB5;--primary-light:#EEF0FF;--accent:#FF6B6B;--success:#22C55E;--dark:#0F0E1A;--text-dark:#1E1B2E;--text-mid:#6B7280;--border:#E5E7EB;--bg:#F9F7FF;--white:#FFFFFF;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--shadow-sm:0 2px 8px rgba(91,79,207,0.08);--shadow-md:0 8px 24px rgba(91,79,207,0.12);--shadow-lg:0 20px 60px rgba(91,79,207,0.18);--font:'Cairo',sans-serif}
/* تنسيق الصفحة: خلفية داكنة متدرجة مع محتوى في المنتصف */
body{font-family:var(--font);background:linear-gradient(135deg,#0F0E1A 0%,#1A1827 40%,#2D1B69 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden}
/* التوهج الضوئي في الخلفية */
body::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(91,79,207,0.25) 0%,transparent 70%);top:30%;left:60%;transform:translate(-50%,-50%);pointer-events:none}

/* البطاقة الرئيسية البيضاء التي تحتوي على خيارات التسجيل */
.page{background:white;border-radius:24px;width:100%;max-width:800px;padding:56px 48px;box-shadow:0 24px 64px rgba(0,0,0,0.3);position:relative;z-index:1;text-align:center}

/* شعار المنصة في أعلى البطاقة */
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px;text-decoration:none}
.logo-icon{width:40px;height:40px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-icon i{color:white;font-size:20px}
.logo-text{font-size:22px;font-weight:800;color:var(--primary)}

/* العنوان والنص التوضيحي */
.page-title{font-size:28px;font-weight:900;color:var(--text-dark);margin-bottom:8px;margin-top:24px}
.page-sub{font-size:15px;color:var(--text-mid);line-height:1.7;margin-bottom:40px;max-width:500px;margin-left:auto;margin-right:auto}

/* ===== شبكة بطاقات اختيار نوع الحساب (ثلاثة أعمدة) ===== */
.types-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:36px}
/* بطاقة نوع حساب واحد (متدرب / مشرف / شركة) */
.type-card{
  background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-xl);
  padding:36px 20px;cursor:pointer;transition:all 0.25s;text-align:center;
  position:relative;overflow:hidden;text-decoration:none;
}
.type-card:hover{border-color:var(--primary);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.type-card:hover .type-icon{background:var(--primary);color:white;transform:scale(1.1)}
/* أيقونة نوع الحساب */
.type-icon{
  width:68px;height:68px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  transition:all 0.25s;
}
.type-title{font-size:18px;font-weight:800;color:var(--text-dark);margin-bottom:8px}
/* قائمة مميزات كل نوع حساب */
.type-features{list-style:none;text-align:right;display:inline-block}
.type-features li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-mid);margin-bottom:4px}
.type-features li i{color:var(--success);font-size:12px;flex-shrink:0}

/* رابط العودة لصفحة تسجيل الدخول */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-mid);text-decoration:none;font-weight:600;transition:color 0.15s}
.back-link:hover{color:var(--primary)}

/* تصميم متجاوب: عمود واحد على الشاشات الصغيرة */
@media(max-width:768px){.types-grid{grid-template-columns:1fr}.page{padding:36px 24px}}
</style>
</head>
<body>

<!-- البطاقة الرئيسية -->
<div class="page">
  <!-- شعار المنصة مع رابط للصفحة الرئيسية -->
  <a href="01-home.html" class="logo">
    <div class="logo-icon"><i class="ti ti-briefcase"></i></div>
    <span class="logo-text">TrainLink</span>
  </a>
  
  <!-- العنوان والنص التوضيحي -->
  <h1 class="page-title">كيف تريد الانضمام؟</h1>
  <p class="page-sub">اختر نوع حسابك لبدء التسجيل في منصة TrainLink</p>

  <!-- ===== شبكة اختيار نوع الحساب: ثلاث بطاقات قابلة للنقر ===== -->
  <div class="types-grid">
    <!-- بطاقة المتدرب: توجيه لصفحة تسجيل المتدرب -->
    <a href="03-register-trainee.html" class="type-card">
      <div class="type-icon" style="background:#EEF0FF;color:var(--primary)"><i class="ti ti-school"></i></div>
      <div class="type-title">متدرب</div>
      <ul class="type-features">
        <li><i class="ti ti-check"></i> بحث وتقديم مباشر</li>
        <li><i class="ti ti-check"></i> تحليل CV بالـ AI</li>
        <li><i class="ti ti-check"></i> متابعة الأداء</li>
      </ul>
    </a>

    <!-- بطاقة المشرف الأكاديمي: توجيه لصفحة تسجيل المشرف -->
    <a href="05-register-supervisor.html" class="type-card">
      <div class="type-icon" style="background:#FEF3C7;color:#F59E0B"><i class="ti ti-chalkboard"></i></div>
      <div class="type-title">مشرف أكاديمي</div>
      <ul class="type-features">
        <li><i class="ti ti-check"></i> متابعة المتدربين</li>
        <li><i class="ti ti-check"></i> تقارير أسبوعية</li>
        <li><i class="ti ti-check"></i> تنبيهات ذكية</li>
      </ul>
    </a>

    <!-- بطاقة الشركة: توجيه لصفحة تسجيل الشركة -->
    <a href="04-register-company.html" class="type-card">
      <div class="type-icon" style="background:#FAECE7;color:#E5534B"><i class="ti ti-building"></i></div>
      <div class="type-title">شركة</div>
      <ul class="type-features">
        <li><i class="ti ti-check"></i> نشر فرص التدريب</li>
        <li><i class="ti ti-check"></i> مراجعة المتقدمين</li>
        <li><i class="ti ti-check"></i> تقارير أداء</li>
      </ul>
    </a>
  </div>

  <!-- رابط العودة لصفحة تسجيل الدخول -->
  <a href="02-login.html" class="back-link">
    <i class="ti ti-arrow-right"></i>
    العودة لتسجيل الدخول
  </a>
</div>

</body>
</html>
