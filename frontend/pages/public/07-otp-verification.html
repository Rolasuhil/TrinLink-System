<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainLink — التحقق من الهوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5B4FCF;--primary-dark:#4A3FB5;--primary-light:#EEF0FF;--success:#22C55E;--warning:#F59E0B;--text-dark:#1E1B2E;--text-mid:#6B7280;--border:#E5E7EB;--bg:#F9F7FF;--radius-md:12px;--font:'Cairo',sans-serif}
body{font-family:var(--font);background:linear-gradient(135deg,#0F0E1A,#2D1B69);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border-radius:20px;width:100%;max-width:440px;padding:48px 40px;box-shadow:0 24px 64px rgba(0,0,0,0.3);text-align:center}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px}
.logo-icon{width:36px;height:36px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-icon i{color:white;font-size:18px}
.logo-text{font-size:18px;font-weight:800;color:var(--primary)}
.icon-wrap{width:72px;height:72px;background:#FEF3C7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.icon-wrap i{font-size:36px;color:var(--warning)}
.title{font-size:22px;font-weight:800;color:var(--text-dark);margin-bottom:8px}
.sub{font-size:14px;color:var(--text-mid);line-height:1.7;margin-bottom:28px}
.sub strong{color:var(--primary)}
.otp-wrap{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.otp-input{width:56px;height:60px;border:2px solid var(--border);border-radius:var(--radius-md);font-size:24px;font-weight:700;text-align:center;font-family:var(--font);color:var(--text-dark);background:var(--bg);outline:none;transition:all 0.15s}
.otp-input:focus{border-color:var(--primary);background:white;box-shadow:0 0 0 3px rgba(91,79,207,0.1)}
.otp-input.filled{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.timer-row{font-size:13px;color:var(--text-mid);margin-bottom:24px}
.timer{color:var(--primary);font-weight:700}
.resend-link{color:var(--primary);text-decoration:none;font-weight:600;cursor:pointer}
.resend-link:disabled{color:var(--text-mid);cursor:default}
.btn-verify{width:100%;padding:13px;border-radius:var(--radius-md);font-size:15px;font-weight:700;color:white;background:var(--primary);border:none;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 16px rgba(91,79,207,0.3);margin-bottom:14px}
.btn-verify:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-back{width:100%;padding:11px;border-radius:var(--radius-md);font-size:13px;font-weight:600;color:var(--text-mid);background:var(--bg);border:1.5px solid var(--border);cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s}
.btn-back:hover{border-color:var(--primary);color:var(--primary)}
.error-msg{background:#FEE2E2;border:1px solid #FECACA;border-radius:var(--radius-md);padding:10px 14px;font-size:13px;color:#DC2626;display:none;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
.error-msg i{font-size:16px}
/* SUCCESS STATE */
.success-state{display:none;text-align:center;padding:20px 0}
.success-icon{width:80px;height:80px;background:#F0FFF4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop 0.4s ease}
.success-icon i{font-size:40px;color:var(--success)}
@keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-icon"><i class="ti ti-briefcase"></i></div><span class="logo-text">TrainLink</span></div>

  <div id="verifyState">
    <div class="icon-wrap"><i class="ti ti-device-mobile-message"></i></div>
    <div class="title">التحقق من هويتك</div>
    <div class="sub">أرسلنا رمز تحقق مكون من 6 أرقام إلى<br><strong id="maskedEmail">example@email.com</strong><br>الرمز صالح لمدة 5 دقائق فقط</div>

    <div class="otp-wrap">
      <input type="text" class="otp-input" maxlength="1" id="o1" oninput="handleOtp(this,0)">
      <input type="text" class="otp-input" maxlength="1" id="o2" oninput="handleOtp(this,1)">
      <input type="text" class="otp-input" maxlength="1" id="o3" oninput="handleOtp(this,2)">
      <input type="text" class="otp-input" maxlength="1" id="o4" oninput="handleOtp(this,3)">
      <input type="text" class="otp-input" maxlength="1" id="o5" oninput="handleOtp(this,4)">
      <input type="text" class="otp-input" maxlength="1" id="o6" oninput="handleOtp(this,5)">
    </div>

    <div class="timer-row">ينتهي الرمز خلال: <span class="timer" id="timerDisplay">05:00</span></div>
    <div class="error-msg" id="errMsg"><i class="ti ti-alert-circle"></i> <span id="errText">الرمز المدخل غير صحيح. حاول مجدداً.</span></div>

    <button class="btn-verify" id="verifyBtn" onclick="verify()"><i class="ti ti-shield-check"></i>تحقق من الرمز</button>
    <button class="btn-back" onclick="window.history.back()"><i class="ti ti-arrow-right"></i>العودة</button>

    <div style="margin-top:16px;font-size:13px;color:var(--text-mid)">لم يصلك الرمز؟ <a class="resend-link" id="resendLink" onclick="resend()">إعادة الإرسال</a></div>
  </div>

  <div class="success-state" id="successState">
    <div class="success-icon"><i class="ti ti-circle-check"></i></div>
    <div class="title" style="color:#15803D">تم التحقق بنجاح!</div>
    <div class="sub">تم التحقق من هويتك بنجاح.<br>جارٍ تحويلك للوحة التحكم...</div>
    <div style="margin-top:20px">
      <div style="width:100%;height:4px;background:var(--bg);border-radius:2px;overflow:hidden">
        <div id="progressBar" style="height:100%;width:0;background:var(--success);border-radius:2px;transition:width 2s linear"></div>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email = params.get('email') || '';
if (email) {
  const masked = email.substring(0, 3) + '***' + email.substring(email.indexOf('@'));
  document.getElementById('maskedEmail').textContent = masked;
}

const inputs = document.querySelectorAll('.otp-input');
let timeLeft = 300;
let timerInt = setInterval(()=>{
  timeLeft--;
  const m=Math.floor(timeLeft/60).toString().padStart(2,'0');
  const s=(timeLeft%60).toString().padStart(2,'0');
  document.getElementById('timerDisplay').textContent=`${m}:${s}`;
  if(timeLeft<=0){clearInterval(timerInt);document.getElementById('timerDisplay').textContent='انتهى';}
},1000);

function handleOtp(el,idx){
  el.classList.add('filled');
  if(el.value&&idx<5)inputs[idx+1].focus();
}

function getOtp(){
  return [...inputs].map(i=>i.value).join('');
}

async function verify(){
  const code=getOtp();
  if(code.length<6){document.getElementById('errMsg').style.display='flex';return;}

  const btn=document.getElementById('verifyBtn');
  btn.disabled=true;
  btn.innerHTML='<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> جاري التحقق...';

  try{
    const res=await fetch('/api/auth/verify-otp/',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,otp_code:code})
    });
    const data=await res.json();

    if(res.ok){
      clearInterval(timerInt);
      if(data.token&&data.user){
        localStorage.setItem('trainlink_token',data.token);
        localStorage.setItem('trainlink_user',JSON.stringify(data.user));
      }
      document.getElementById('verifyState').style.display='none';
      document.getElementById('successState').style.display='block';
      setTimeout(()=>{document.getElementById('progressBar').style.width='100%'},100);
      const pt=data.user?.person_type||'trainee';
      const dashboards={trainee:'08-trainee-dashboard.html',company:'18-company-dashboard.html',supervisor:'24-supervisor-dashboard.html',admin:'28-admin-dashboard.html'};
      setTimeout(()=>{window.location.href='../'+pt+'/'+(dashboards[pt]||'08-trainee-dashboard.html')},2200);
    }else{
      document.getElementById('errText').textContent=data.detail||data.error||'الرمز المدخل غير صحيح. حاول مجدداً.';
      document.getElementById('errMsg').style.display='flex';
    }
  }catch(err){
    document.getElementById('errText').textContent='حدث خطأ في الاتصال بالخادم';
    document.getElementById('errMsg').style.display='flex';
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="ti ti-shield-check"></i>تحقق من الرمز';
  }
}

async function resend(){
  try{
    await fetch('/api/auth/resend-otp/',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email})
    });
    timeLeft=300;
    inputs.forEach(i=>{i.value='';i.classList.remove('filled');});
    inputs[0].focus();
    document.getElementById('errMsg').style.display='none';
  }catch(err){}
}
</script>
</body>
</html>
