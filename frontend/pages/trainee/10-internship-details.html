<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainLink — تفاصيل فرصة التدريب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5B4FCF;--primary-dark:#4A3FB5;--primary-light:#EEF0FF;--accent:#FF6B6B;--success:#22C55E;--success-light:#F0FFF4;--warning:#F59E0B;--warning-light:#FEF3C7;--text-dark:#1E1B2E;--text-mid:#6B7280;--border:#E5E7EB;--bg:#F9F7FF;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--font:'Cairo',sans-serif;--sidebar:220px}
body{font-family:var(--font);background:var(--bg);color:var(--text-dark);display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:#1E1B2E;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;right:0;height:100vh;z-index:100}
.sidebar-logo{display:flex;align-items:center;gap:8px;padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center}
.sidebar-logo-icon i{color:white;font-size:15px}
.sidebar-logo-text{font-size:15px;font-weight:800;color:white}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;margin:1px 8px;border-radius:var(--radius-sm);transition:all 0.15s;text-decoration:none}
.nav-item:hover{background:rgba(255,255,255,0.06)}
.nav-item.active{background:var(--primary)}
.nav-item i{font-size:16px;color:rgba(255,255,255,0.5);width:18px}
.nav-item.active i,.nav-item.active span{color:white}
.nav-item span{font-size:12px;color:rgba(255,255,255,0.5)}
.nav-badge{background:var(--accent);color:white;font-size:9px;padding:1px 6px;border-radius:20px;margin-right:auto}
.sidebar-bottom{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,0.08)}
.main{margin-right:var(--sidebar);flex:1;display:flex;flex-direction:column}
.topbar{background:white;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px}
.breadcrumb a{color:var(--text-mid);text-decoration:none}
.breadcrumb a:hover{color:var(--primary)}
.breadcrumb span{color:var(--text-mid)}
.breadcrumb .current{color:var(--text-dark);font-weight:600}
.content{padding:20px 24px;flex:1}
.hero-card{background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero-left{display:flex;gap:16px;align-items:flex-start;flex:1}
.company-logo{width:64px;height:64px;border-radius:var(--radius-lg);background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white;flex-shrink:0}
.job-title{font-size:22px;font-weight:800;color:var(--text-dark);margin-bottom:4px}
.company-name{font-size:14px;color:var(--text-mid);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.verified{color:var(--success);font-size:13px;display:flex;align-items:center;gap:3px}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px}
.hero-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex-shrink:0}
.btn-apply-main{background:var(--primary);color:white;border:none;padding:12px 24px;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 16px rgba(91,79,207,0.3)}
.btn-apply-main:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-save-main{background:transparent;color:var(--primary);border:1.5px solid var(--primary);padding:10px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px;transition:all 0.15s}
.btn-save-main:hover{background:var(--primary-light)}
.hero-stats{display:flex;gap:24px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap}
.hstat{display:flex;align-items:center;gap:8px}
.hstat i{color:var(--text-mid);font-size:18px}
.hstat-label{font-size:11px;color:var(--text-mid)}
.hstat-val{font-size:13px;font-weight:700;color:var(--text-dark)}
.detail-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.card{background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab-btn{padding:10px 18px;font-size:13px;color:var(--text-mid);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:var(--font);font-weight:600;transition:all 0.15s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn:hover:not(.active){color:var(--text-dark)}
.tab-content{display:none}
.tab-content.active{display:block}
.desc-section{margin-bottom:18px}
.desc-section-title{font-size:14px;font-weight:700;color:var(--text-dark);margin-bottom:8px}
.desc-text{font-size:13px;color:var(--text-mid);line-height:1.8;white-space:pre-line}
.desc-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.desc-list li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-mid);line-height:1.5}
.desc-list li i{font-size:14px;margin-top:1px;flex-shrink:0}
.skills-wrap{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag{padding:5px 12px;border-radius:20px;font-size:12px}
.skill-required{background:var(--primary);color:white}
.skill-optional{background:var(--primary-light);color:var(--primary)}
.review-summary{display:flex;gap:20px;align-items:center;background:var(--bg);border-radius:var(--radius-md);padding:16px;margin-bottom:18px}
.review-score{text-align:center;flex-shrink:0}
.review-big{font-size:40px;font-weight:900;color:var(--text-dark)}
.review-stars{color:var(--warning);font-size:18px}
.review-count{font-size:12px;color:var(--text-mid)}
.review-bars{flex:1}
.rbar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.rbar-label{font-size:11px;color:var(--text-mid);width:16px;text-align:right}
.rbar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.rbar-fill{height:100%;border-radius:3px;background:var(--warning)}
.rbar-count{font-size:11px;color:var(--text-mid);width:20px}
.review-item{padding:14px 0;border-bottom:1px solid var(--border)}
.review-item:last-child{border-bottom:none}
.review-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0}
.review-name{font-size:13px;font-weight:700;color:var(--text-dark)}
.review-date{font-size:11px;color:var(--text-mid)}
.review-text{font-size:13px;color:var(--text-mid);line-height:1.7}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-key{color:var(--text-mid)}
.info-val{color:var(--text-dark);font-weight:600}
.deadline-box{background:var(--warning-light);border:1px solid #FCD34D;border-radius:var(--radius-md);padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.deadline-text{font-size:12px;color:#B45309;font-weight:600}
.btn-full{width:100%;padding:12px;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;margin-bottom:8px}
.btn-full-primary{background:var(--primary);color:white;border:none;box-shadow:0 4px 16px rgba(91,79,207,0.3)}
.btn-full-primary:hover{background:var(--primary-dark)}
.btn-full-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-full-outline:hover{background:var(--primary-light)}
.share-row{display:flex;gap:8px;margin-top:8px}
.share-btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-mid);cursor:pointer;background:white;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:5px;transition:all 0.15s}
.share-btn:hover{border-color:var(--primary);color:var(--primary)}
.similar-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all 0.15s}
.similar-item:last-child{border-bottom:none}
.similar-item:hover{padding-right:4px}
.similar-logo{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:var(--radius-lg);padding:28px;width:90%;max-width:460px}
.modal-title{font-size:18px;font-weight:800;color:var(--text-dark);margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--text-mid);margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:5px}
.form-textarea{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);resize:none;min-height:80px;outline:none}
.form-textarea:focus{border-color:var(--primary)}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-md);padding:16px;text-align:center;cursor:pointer;transition:all 0.15s}
.upload-area:hover{border-color:var(--primary);background:var(--primary-light)}
.modal-footer{display:flex;gap:10px;margin-top:16px}
.btn-cancel{flex:1;padding:10px;border-radius:var(--radius-md);font-size:13px;font-weight:600;color:var(--text-mid);background:var(--bg);border:1px solid var(--border);cursor:pointer;font-family:var(--font)}
.btn-confirm{flex:2;padding:10px;border-radius:var(--radius-md);font-size:13px;font-weight:700;color:white;background:var(--primary);border:none;cursor:pointer;font-family:var(--font)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E1B2E;color:white;padding:12px 20px;border-radius:var(--radius-lg);font-size:13px;display:none;align-items:center;gap:10px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.toast.show{display:flex}
.status-open{background:var(--success-light);color:#15803D;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-closed{background:#FFF0F0;color:#DC2626;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-full{background:var(--warning-light);color:#B45309;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
</style>
</head>

  <div class="topbar">
    <div class="breadcrumb">
      <a href="08-trainee-dashboard.html">الرئيسية</a>

<script>
(function(){var t=localStorage.getItem('trainlink_token');if(!t){window.location.href='../public/02-login.html';}})();
var API='/api';
var token=localStorage.getItem('trainlink_token');
var internData=null;
var companyData=null;

function authHeaders(){return {'Authorization':'Bearer '+token};}
function showToast(msg){var t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}

function getUrlId(){return new URLSearchParams(window.location.search).get('id');}

function switchTab(btn,id){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}

var saved=false;
function toggleSave(){
  saved=!saved;
  document.getElementById('saveIcon').className=saved?'ti ti-bookmark-filled':'ti ti-bookmark';
  document.getElementById('saveIconFull').className=saved?'ti ti-bookmark-filled':'ti ti-bookmark';
  showToast(saved?'تم حفظ الفرصة!':'تم الازالة من المحفوظات');
}

function openModal(){document.getElementById('applyModal').classList.add('open');}
function closeModal(){document.getElementById('applyModal').classList.remove('open');}

async function submitApp(){
  var id=getUrlId();
  if(!id){showToast('خطأ: لا توجد فرصة');return;}
  var btn=document.getElementById('btnSubmitApp');
  btn.disabled=true;btn.textContent='جاري الارسال...';
  var fd=new FormData();
  fd.append('internship_id',id);
  fd.append('cover_letter',document.getElementById('coverLetter').value);
  try{
    var res=await fetch(API+'/internships/applications/',{method:'POST',headers:authHeaders(),body:fd});
    if(!res.ok){var err=await res.json().catch(function(){});throw new Error(err.detail||err.error||'Failed');}
    closeModal();showToast('تم ارسال طلبك بنجاح!');
  }catch(e){closeModal();showToast('حدث خطأ: '+(e.message||'لم يتم الارسال'));}
  btn.disabled=false;btn.textContent='ارسال الطلب';
}

async function loadUserProfile(){
  try{
    var res=await fetch(API+'/auth/profile/',{headers:authHeaders()});
    if(!res.ok)return;
    var d=await res.json();
    var name=d.full_name||'متدرب';
    var ini=name.substring(0,2);

    document.getElementById('sidebarName').textContent=name;
    document.getElementById('topAvatar').textContent=ini;

}

function daysUntil(dateStr){
  if(!dateStr)return null;
  var now=new Date();
  var target=new Date(dateStr);
  var diff=Math.ceil((target-now)/(1000*60*60*24));
  return diff;
}

async function loadInternship(){
  var id=getUrlId();
  if(!id){showToast('لم يتم تحديد الفرصة');return;}
  try{
    var res=await fetch(API+'/internships/'+id+'/',{headers:authHeaders()});
    if(!res.ok)throw new Error('Not found');
    var d=await res.json();
    internData=d;

    document.title='TrainLink — '+d.title;
    document.getElementById('breadcrumbTitle').textContent=d.title;
    document.getElementById('heroTitle').textContent=d.title;
    document.getElementById('modalSub').textContent=d.title+' — '+d.company;

    var ini=d.company?d.company.substring(0,2):'--';
    document.getElementById('heroLogo').textContent=ini;
    document.getElementById('heroCompany').innerHTML='<i class="ti ti-building"></i> '+d.company;

    var tags=[];
    var statusMap={'open':'status-open','closed':'status-closed','full':'status-full'};
    var statusLabel={'open':'مفتوح','closed':'مغلق','full':'مكتمل'};
    tags.push('<span class="'+(statusMap[d.status]||'status-open')+'">'+(statusLabel[d.status]||d.status)+'</span>');
    tags.push('<span class="tag" style="background:'+(d.is_paid?'#FFF0F0;color:#DC2626':'var(--success-light);color:#15803D')+'"><i class="ti ti-'+(d.is_paid?'currency-dollar':'gift')+'"></i>'+(d.is_paid?'مدفوع':'مجاني')+'</span>');
    if(d.location)tags.push('<span class="tag" style="background:var(--primary-light);color:var(--primary)"><i class="ti ti-map-pin"></i>'+d.location+'</span>');
    if(d.internship_type_display)tags.push('<span class="tag" style="background:var(--bg);color:var(--text-mid)"><i class="ti ti-building-office"></i>'+d.internship_type_display+'</span>');
    if(d.available_positions)tags.push('<span class="tag" style="background:var(--bg);color:var(--text-mid)"><i class="ti ti-users"></i>'+d.available_positions+' مقاعد</span>');
    if(d.work_days)tags.push('<span class="tag" style="background:var(--bg);color:var(--text-mid)"><i class="ti ti-calendar"></i>'+d.work_days+'</span>');
    document.getElementById('heroTags').innerHTML=tags.join('');

    var statsHtml='';
    if(d.deadline){
      var days=daysUntil(d.deadline);
      var dlColor=days!==null&&days<=7?'color:var(--accent)':'color:var(--text-dark)';
      statsHtml+='<div class="hstat"><i class="ti ti-calendar-due"></i><div><div class="hstat-label">آخر موعد</div><div class="hstat-val" style="'+dlColor+'">'+d.deadline+'</div></div></div>';
    }
    if(d.acceptance_rate!==undefined){
      statsHtml+='<div class="hstat"><i class="ti ti-check" style="color:var(--success)"></i><div><div class="hstat-label">نسبة القبول</div><div class="hstat-val" style="color:var(--success)">'+d.acceptance_rate+'%</div></div></div>';
    }
    if(d.available_positions){
      statsHtml+='<div class="hstat"><i class="ti ti-armchair"></i><div><div class="hstat-label">المقاعد</div><div class="hstat-val">'+d.available_positions+'</div></div></div>';
    }
    if(d.start_date){
      statsHtml+='<div class="hstat"><i class="ti ti-calendar-star"></i><div><div class="hstat-label">يبدأ</div><div class="hstat-val">'+d.start_date+'</div></div></div>';
    }
    if(d.end_date){
      statsHtml+='<div class="hstat"><i class="ti ti-calendar-check"></i><div><div class="hstat-label">ينتهي</div><div class="hstat-val">'+d.end_date+'</div></div></div>';
    }
    document.getElementById('heroStats').innerHTML=statsHtml;

    if(d.deadline){
      var days2=daysUntil(d.deadline);
      document.getElementById('deadlineText').innerHTML=days2!==null&&days2>=0?'ينتهي التقديم خلال <strong>'+days2+' يوم</strong>':'انتهى التسجيل';
    }

    if(d.description){document.getElementById('tabDesc').textContent=d.description;}
    if(d.requirements){document.getElementById('reqSection').style.display='block';document.getElementById('tabReqs').textContent=d.requirements;}
    if(d.learning_outcomes){document.getElementById('learnSection').style.display='block';document.getElementById('tabLearn').textContent=d.learning_outcomes;}

    var allSkills=(d.additional_skills||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var reqSkills=(d.requirements||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    if(reqSkills.length){
      document.getElementById('reqSkillsWrap').innerHTML=reqSkills.map(function(s){return '<span class="skill-tag skill-required">'+s+'</span>';}).join('');
    }
    if(allSkills.length){
      document.getElementById('optSkillsWrap').innerHTML=allSkills.map(function(s){return '<span class="skill-tag skill-optional">'+s+'</span>';}).join('');
    }
    if(!reqSkills.length&&!allSkills.length){document.getElementById('skillsSection').innerHTML='<div style="padding:16px;text-align:center;color:var(--text-mid);font-size:12px">لا توجد مهارات محددة</div>';}

    var sideInfo='';
    sideInfo+='<div class="info-row"><span class="info-key">نوع التدريب</span><span class="info-val" style="color:'+(d.is_paid?'#DC2626':'var(--success)')+'">'+(d.is_paid?'مدفوع':'مجاني')+'</span></div>';
    if(d.location)sideInfo+='<div class="info-row"><span class="info-key">الموقع</span><span class="info-val">'+d.location+'</span></div>';
    if(d.internship_type_display)sideInfo+='<div class="info-row"><span class="info-key">النوع</span><span class="info-val">'+d.internship_type_display+'</span></div>';
    if(d.work_days)sideInfo+='<div class="info-row"><span class="info-key">ايام العمل</span><span class="info-val">'+d.work_days+'</span></div>';
    if(d.available_positions)sideInfo+='<div class="info-row"><span class="info-key">المقاعد</span><span class="info-val">'+d.available_positions+'</span></div>';
    sideInfo+='<div class="info-row"><span class="info-key">شهادة اتمام</span><span class="info-val" style="color:'+(d.has_certificate?'var(--success)':'var(--text-mid)')+'">'+(d.has_certificate?'متوفرة':'غير متوفرة')+'</span></div>';
    document.getElementById('sidebarInfo').innerHTML=sideInfo;

    loadSimilar(d.company_id);
    loadCompanyReviews(d.company_id);
  }catch(e){showToast('حدث خطأ في تحميل تفاصيل الفرصة');}
}

async function loadSimilar(companyId){
  try{
    var res=await fetch(API+'/internships/',{headers:authHeaders()});
    if(!res.ok)return;
    var data=await res.json();
    var list=Array.isArray(data)?data:(data.results||[]);
    var currentId=parseInt(getUrlId());
    var similar=list.filter(function(i){return i.id!==currentId;}).slice(0,3);
    if(!similar.length){document.getElementById('similarList').innerHTML='<div style="padding:12px;text-align:center;color:var(--text-mid);font-size:12px">لا توجد فرص مشابهة</div>';return;}
    var colors=['#5B4FCF','#FF6B6B','#22C55E','#F59E0B','#EC4899'];
    document.getElementById('similarList').innerHTML=similar.map(function(item,i){
      var ini=(item.company||'ش').substring(0,2);
      var c=colors[i%colors.length];
      var paid=item.is_paid;
      return '<div class="similar-item" onclick="window.location.href=\'10-internship-details.html?id='+item.id+'\'">'+
        '<div class="similar-logo" style="background:'+c+'">'+ini+'</div>'+
        '<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text-dark)">'+item.title+'</div>'+
        '<div style="font-size:11px;color:var(--text-mid)">'+item.company+'</div></div>'+
        '<span style="font-size:10px;background:'+(paid?'#FFF0F0;color:#DC2626':'var(--success-light);color:#15803D')+';padding:2px 8px;border-radius:20px">'+(paid?'مدفوع':'مجاني')+'</span>'+
      '</div>';
    }).join('');
  }catch(e){}
}

async function loadCompanyReviews(companyId){
  try{
    var res=await fetch(API+'/community/ratings/',{headers:authHeaders()});
    if(!res.ok)return;
    var data=await res.json();
    var list=Array.isArray(data)?data:(data.results||[]);
    var companyReviews=list.filter(function(r){return r.company_name===internData.company;});
    if(!companyReviews.length){
      document.getElementById('revAvg').textContent='--';
      document.getElementById('revStars').innerHTML='<span style="color:var(--text-mid);font-size:13px">لا توجد تقييمات لهذه الشركة</span>';
      document.getElementById('revCount').textContent='';
      document.getElementById('reviewsList').innerHTML='';
      return;
    }
    var avg=(companyReviews.reduce(function(s,r){return s+(r.score||0);},0)/companyReviews.length).toFixed(1);
    var fs=Math.floor(avg);
    document.getElementById('revAvg').textContent=avg;
    document.getElementById('revStars').innerHTML='★'.repeat(fs)+'☆'.repeat(5-fs);
    document.getElementById('revCount').textContent=companyReviews.length+' تقييم';

    var counts=[0,0,0,0,0];
    companyReviews.forEach(function(r){var s=Math.round(r.score||0);if(s>=1&&s<=5)counts[s-1]++;});
    var barsHtml='';
    for(var i=5;i>=1;i--){
      var pct=companyReviews.length?Math.round((counts[i-1]/companyReviews.length)*100):0;
      barsHtml+='<div class="rbar-row"><span class="rbar-label">'+i+'</span><div class="rbar-track"><div class="rbar-fill" style="width:'+pct+'%"></div></div><span class="rbar-count">'+counts[i-1]+'</span></div>';
    }
    document.getElementById('revBars').innerHTML=barsHtml;

    var colors=['#5B4FCF','#FF6B6B','#22C55E','#F59E0B','#EC4899'];
    document.getElementById('reviewsList').innerHTML=companyReviews.slice(0,5).map(function(r){
      var name=r.trainee_name||'متدرب';
      var ini=name.substring(0,2);
      var c=colors[Math.floor(Math.random()*colors.length)];
      var rs='★'.repeat(Math.floor(r.score||0))+'☆'.repeat(5-Math.floor(r.score||0));
      return '<div class="review-item"><div class="review-header"><div class="review-avatar" style="background:'+c+'">'+ini+'</div><div><div class="review-name">'+name+'</div><div class="review-date">'+(r.created_at?new Date(r.created_at).toLocaleDateString('ar-EG'):'')+'</div></div><div style="margin-right:auto;color:var(--warning)">'+rs+'</div></div><div class="review-text">'+(r.review||'')+'</div></div>';
    }).join('');
  }catch(e){}
}
